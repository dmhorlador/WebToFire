<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — TaskFlow</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loader-overlay" id="pageLoader"><div class="spinner-grad"></div></div>

<!-- Alerts -->
<div id="alertContainer"></div>

<div class="auth-wrapper">
  <div class="hero-blob hero-blob-1"></div>
  <div class="hero-blob hero-blob-2"></div>

  <button class="theme-toggle-btn position-fixed top-0 end-0 m-4" id="themeToggle" title="Toggle dark mode">
    <i class="bi bi-moon-stars-fill"></i>
  </button>

  <a href="index.html" class="position-fixed top-0 start-0 m-4 d-flex align-items-center gap-2 fw-bold text-decoration-none" style="color:var(--text-primary); z-index:2;">
    <i class="bi bi-arrow-left"></i> Back home
  </a>

  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo"><i class="bi bi-check2-square"></i></div>
      <h3 class="fw-bold mb-1">Welcome back</h3>
      <p class="text-secondary mb-0">Log in to continue to TaskFlow</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3 input-icon-group">
        <i class="bi bi-envelope"></i>
        <input type="email" class="form-control form-control-custom" id="loginEmail" placeholder="Email address" required>
      </div>
      <div class="mb-2 input-icon-group">
        <i class="bi bi-lock"></i>
        <input type="password" class="form-control form-control-custom" id="loginPassword" placeholder="Password" required minlength="6">
        <i class="bi bi-eye toggle-password" data-target="loginPassword"></i>
      </div>
      <div class="d-flex justify-content-end mb-3">
        <a href="#" id="forgotPasswordLink" class="small text-decoration-none" style="color:var(--accent);">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-gradient w-100 py-2 fw-semibold" id="loginBtn">
        <span class="btn-text">Log In</span>
        <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
      </button>
    </form>

    <div class="divider-text">or</div>

    <p class="text-center mb-0 text-secondary">
      Don't have an account?
      <a href="register.html" class="fw-semibold text-decoration-none" style="color:var(--accent);">Sign up</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase SDKs (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
