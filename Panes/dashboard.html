<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — TaskFlow</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loader-overlay" id="pageLoader"><div class="spinner-grad"></div></div>
<div id="alertContainer"></div>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="dashboard-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="logo-box"><i class="bi bi-check2-square"></i></span>
      <span>Task<span class="brand-gradient-text">Flow</span></span>
    </div>

    <div class="sidebar-link active" data-filter="all">
      <i class="bi bi-grid-1x2"></i> All Tasks
    </div>
    <div class="sidebar-link" data-filter="pending">
      <i class="bi bi-hourglass-split"></i> Pending
    </div>
    <div class="sidebar-link" data-filter="completed">
      <i class="bi bi-check2-circle"></i> Completed
    </div>
    <div class="sidebar-link" data-filter="overdue">
      <i class="bi bi-exclamation-octagon"></i> Overdue
    </div>

    <hr class="my-2" style="border-color:var(--border-color);">
    <div class="sidebar-link" data-priority-filter="high">
      <i class="bi bi-flag-fill text-danger"></i> High Priority
    </div>
    <div class="sidebar-link" data-priority-filter="medium">
      <i class="bi bi-flag-fill text-warning"></i> Medium Priority
    </div>
    <div class="sidebar-link" data-priority-filter="low">
      <i class="bi bi-flag-fill text-success"></i> Low Priority
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-link" id="toggleThemeSidebar">
        <i class="bi bi-moon-stars"></i> <span id="themeLabel">Dark Mode</span>
      </div>
      <div class="sidebar-link" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Log Out
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="theme-toggle-btn sidebar-toggle-btn" id="sidebarToggleBtn">
          <i class="bi bi-list"></i>
        </button>
        <div>
          <h4 class="fw-bold mb-0" id="greetingText">Welcome back 👋</h4>
          <p class="text-secondary mb-0 small" id="todayDate"></p>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button class="theme-toggle-btn" id="themeToggle" title="Toggle dark mode">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="fw-semibold small" id="userName">User</span>
        </div>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div>
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
          <div class="stat-icon bg-total"><i class="bi bi-list-task"></i></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div>
            <div class="stat-number" id="statCompleted">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-icon bg-completed"><i class="bi bi-check2-circle"></i></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div>
            <div class="stat-number" id="statPending">0</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat-icon bg-pending"><i class="bi bi-hourglass-split"></i></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div>
            <div class="stat-number" id="statOverdue">0</div>
            <div class="stat-label">Overdue</div>
          </div>
          <div class="stat-icon bg-overdue"><i class="bi bi-exclamation-octagon"></i></div>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar-card">
      <div class="row g-3 align-items-center">
        <div class="col-lg-4">
          <div class="search-input-wrap">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control form-control-custom" id="searchInput" placeholder="Search tasks...">
          </div>
        </div>
        <div class="col-lg-6">
          <div class="d-flex gap-2 flex-wrap" id="filterPills">
            <span class="filter-pill active" data-status="all">All</span>
            <span class="filter-pill" data-status="pending">Pending</span>
            <span class="filter-pill" data-status="completed">Completed</span>
            <span class="filter-pill" data-status="overdue">Overdue</span>
          </div>
        </div>
        <div class="col-lg-2 text-lg-end">
          <button class="btn btn-gradient w-100" data-bs-toggle="modal" data-bs-target="#taskModal" id="openAddTaskBtn">
            <i class="bi bi-plus-lg me-1"></i> Add Task
          </button>
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap mt-3" id="priorityFilterPills">
        <span class="filter-pill active" data-priority="all">All Priorities</span>
        <span class="filter-pill" data-priority="high">High</span>
        <span class="filter-pill" data-priority="medium">Medium</span>
        <span class="filter-pill" data-priority="low">Low</span>
      </div>
    </div>

    <!-- Task list -->
    <div id="taskList">
      <!-- Tasks injected by JS -->
    </div>
  </main>
</div>

<!-- Add/Edit Task Modal -->
<div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-content-custom">
      <div class="modal-header modal-header-custom">
        <h5 class="modal-title fw-bold" id="taskModalLabel"><i class="bi bi-plus-circle me-2"></i>Add New Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="taskForm">
        <div class="modal-body">
          <input type="hidden" id="taskId">

          <div class="mb-3">
            <label class="form-label fw-semibold small">Task Title</label>
            <input type="text" class="form-control form-control-custom" id="taskTitle" placeholder="e.g. Finish manuscript draft" required style="padding-left:14px;">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small">Description (optional)</label>
            <textarea class="form-control form-control-custom" id="taskDescription" rows="3" placeholder="Add more details..." style="padding-left:14px;"></textarea>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold small">Due Date</label>
              <input type="date" class="form-control form-control-custom" id="taskDueDate" style="padding-left:14px;" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold small">Due Time (optional)</label>
              <input type="time" class="form-control form-control-custom" id="taskDueTime" style="padding-left:14px;">
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label fw-semibold small">Priority</label>
            <div class="priority-select-group">
              <label class="priority-option p-low selected">
                <input type="radio" name="priority" value="low" checked>
                <i class="bi bi-flag-fill me-1"></i> Low
              </label>
              <label class="priority-option p-medium">
                <input type="radio" name="priority" value="medium">
                <i class="bi bi-flag-fill me-1"></i> Medium
              </label>
              <label class="priority-option p-high">
                <input type="radio" name="priority" value="high">
                <i class="bi bi-flag-fill me-1"></i> High
              </label>
            </div>
          </div>
        </div>
        <div class="modal-footer modal-footer-custom">
          <button type="button" class="btn btn-outline-gradient px-4" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-gradient px-4" id="saveTaskBtn">
            <span class="btn-text">Save Task</span>
            <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-content-custom text-center p-3">
      <div class="modal-body">
        <div class="mb-3">
          <i class="bi bi-trash3 text-danger" style="font-size:2.6rem;"></i>
        </div>
        <h5 class="fw-bold">Delete this task?</h5>
        <p class="text-secondary">This action cannot be undone.</p>
      </div>
      <div class="modal-footer modal-footer-custom justify-content-center border-0 pt-0">
        <button type="button" class="btn btn-outline-gradient px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger px-4" id="confirmDeleteBtn">
          <i class="bi bi-trash3 me-1"></i> Delete
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
