<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes — Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <h1>Notes</h1>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search notes..." />
  </div>

  <div class="topbar-actions">
    <span class="user-email" id="userEmail"></span>
    <button class="btn-new" id="newNoteBtn">+ New note</button>
    <button class="btn-logout" id="logoutBtn">Log out</button>
  </div>
</header>

<main>
  <div id="emptyState" class="empty-state hidden">
    <h2>No notes yet</h2>
    <p>Click "+ New note" to write your first one.</p>
  </div>

  <div id="notesGrid" class="notes-grid"></div>
</main>

<!-- Note editor modal (used for both create and edit) -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">New note</h2>
    <form id="noteForm">
      <div class="field">
        <label for="noteTitle">Title</label>
        <input type="text" id="noteTitle" required maxlength="120" />
      </div>
      <div class="field">
        <label for="noteBody">Content</label>
        <textarea id="noteBody" maxlength="5000"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-save" id="saveBtn">Save note</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
