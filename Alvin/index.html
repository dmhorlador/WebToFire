<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>Notes</h1>
    </div>
    <p class="auth-sub" id="authSubtext">Sign in to your account</p>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">Log in</button>
      <button class="tab-btn" id="tabRegister" type="button">Register</button>
    </div>

    <!-- Login form -->
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Log in</button>
      <div class="form-msg" id="loginMsg"></div>
    </form>

    <!-- Register form -->
    <form id="registerForm" class="hidden">
      <div class="field">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="registerConfirm">Confirm password</label>
        <input type="password" id="registerConfirm" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary" id="registerBtn">Create account</button>
      <div class="form-msg" id="registerMsg"></div>
    </form>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
