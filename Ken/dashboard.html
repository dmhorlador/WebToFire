<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker | Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="assets/logo.svg" alt="logo" class="logo">
      <span>ExpenseTracker</span>
    </div>
    <div class="navbar-user">
      <span id="userGreeting">Hello!</span>
      <button class="btn btn-outline" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <main class="dashboard">

    <!-- SUMMARY CARDS -->
    <section class="summary-cards">
      <div class="card summary-card">
        <span class="summary-label">Total Expenses</span>
        <span class="summary-value" id="totalExpenses">$0.00</span>
      </div>
      <div class="card summary-card">
        <span class="summary-label">This Month</span>
        <span class="summary-value" id="monthExpenses">$0.00</span>
      </div>
      <div class="card summary-card">
        <span class="summary-label">Transactions</span>
        <span class="summary-value" id="totalCount">0</span>
      </div>
    </section>

    <!-- TOOLBAR -->
    <section class="card toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by title or category...">
      </div>
      <button class="btn btn-primary" id="addExpenseBtn">+ Add Expense</button>
    </section>

    <!-- EXPENSE LIST -->
    <section class="card expenses-section">
      <div class="table-wrapper">
        <table class="expenses-table" id="expensesTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expensesBody"></tbody>
        </table>
      </div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <img src="assets/empty-wallet.svg" alt="No expenses" width="120">
        <p>No expenses found. Start by adding one!</p>
      </div>
    </section>
  </main>

  <!-- ADD / EDIT EXPENSE MODAL -->
  <div class="modal-overlay" id="expenseModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Expense</h2>
        <button class="modal-close" id="closeModalBtn" type="button">&times;</button>
      </div>

      <form id="expenseForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Grocery shopping" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="notes">Notes (optional)</label>
          <textarea id="notes" rows="2" placeholder="Additional details..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Expense</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
